<?xml version="1.0" encoding="UTF-8"?>
<!-- Back cover: 6x9 inches at 300dpi = 1800x2700px -->
<svg width="1800" height="2700" viewBox="0 0 1800 2700"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1f3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffad00"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1800" height="2700" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1800" height="8" fill="url(#accent)"/>

  <!-- Author name -->
  <text x="900" y="360"
        font-family="Georgia, Times New Roman, serif"
        font-size="64" font-weight="bold"
        text-anchor="middle" fill="#ffffff" letter-spacing="1.2">AI(2)M(2)IA</text>

  <!-- Divider -->
  <rect x="300" y="400" width="1200" height="3" rx="1" fill="url(#accent)" opacity="0.7"/>

  <!-- Back cover blurb -->
  <text x="900" y="490"
        font-family="Georgia, serif" font-size="50" font-style="italic"
        text-anchor="middle" fill="#ff6b35">"The cloud doesn't solve</text>
  <text x="900" y="555"
        font-family="Georgia, serif" font-size="50" font-style="italic"
        text-anchor="middle" fill="#ff6b35">architecture problems.</text>
  <text x="900" y="620"
        font-family="Georgia, serif" font-size="50" font-style="italic"
        text-anchor="middle" fill="#ff6b35">It amplifies them."</text>

  <!-- Description paragraphs -->
  <text x="160" y="780"
        font-family="Georgia, serif" font-size="42"
        fill="#ddeeff" opacity="0.9">When Maya realized her family restaurant was losing orders</text>
  <text x="160" y="835"
        font-family="Georgia, serif" font-size="42"
        fill="#ddeeff" opacity="0.9">because the phone was always busy, she didn't know what</text>
  <text x="160" y="890"
        font-family="Georgia, serif" font-size="42"
        fill="#ddeeff" opacity="0.9">"the cloud" meant. Neither did Tom, her cousin. Or Leo,</text>
  <text x="160" y="945"
        font-family="Georgia, serif" font-size="42"
        fill="#ddeeff" opacity="0.9">the developer who had already deployed something without</text>
  <text x="160" y="1000"
        font-family="Georgia, serif" font-size="42"
        fill="#ddeeff" opacity="0.9">knowing exactly where it was running.</text>

  <text x="160" y="1095"
        font-family="Georgia, serif" font-size="42"
        fill="#ddeeff" opacity="0.9">This book follows their journey — from the first EC2 instance</text>
  <text x="160" y="1150"
        font-family="Georgia, serif" font-size="42"
        fill="#ddeeff" opacity="0.9">to a production-grade, well-architected AWS infrastructure.</text>
  <text x="160" y="1205"
        font-family="Georgia, serif" font-size="42"
        fill="#ddeeff" opacity="0.9">Every service is introduced through a real problem. Every</text>
  <text x="160" y="1260"
        font-family="Georgia, serif" font-size="42"
        fill="#ddeeff" opacity="0.9">trade-off is explained honestly. Nothing is oversimplified.</text>

  <!-- What you'll learn bullets -->
  <rect x="160" y="1340" width="1480" height="3" fill="#1a3a6b" opacity="0.8"/>
  <text x="160" y="1410"
        font-family="Georgia, serif" font-size="44" font-weight="bold"
        fill="#ffad00">What you will learn:</text>

  <g font-family="Georgia, serif" font-size="40" fill="#ddeeff" opacity="0.9">
    <text x="200" y="1480">▸  Major AWS services through narrative, not memorization</text>
    <text x="200" y="1535">▸  How to pass the AWS SAA-C03 certification exam</text>
    <text x="200" y="1590">▸  Architecture trade-offs across the Well-Architected pillars</text>
    <text x="200" y="1645">▸  Cost optimization that saved Nimbus $33,000/year</text>
    <text x="200" y="1700">▸  Security, resilience, and the Well-Architected Framework</text>
    <text x="200" y="1755">▸  How to think like an architect, not just an engineer</text>
  </g>

  <!-- SAA-C03 badge -->
  <rect x="500" y="2020" width="800" height="90" rx="14"
        fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.8"/>
  <text x="900" y="2080"
        font-family="Courier New, monospace" font-size="40" font-weight="bold"
        text-anchor="middle" fill="#ffad00" letter-spacing="2">AWS SAA-C03 EXAM GUIDE INCLUDED</text>

  <!-- Bottom divider -->
  <rect x="300" y="2160" width="1200" height="3" rx="1" fill="url(#accent)" opacity="0.7"/>

  <!-- Bio blurb -->
  <text x="900" y="2230"
        font-family="Georgia, serif" font-size="38" font-style="italic"
        text-anchor="middle" fill="#aac8e8" opacity="0.8">AI(2)M(2)IA writes about technology</text>
  <text x="900" y="2278"
        font-family="Georgia, serif" font-size="38" font-style="italic"
        text-anchor="middle" fill="#aac8e8" opacity="0.8">for people who learn best through stories.</text>

  <!-- Category -->
  <text x="160" y="2590"
        font-family="Georgia, serif" font-size="36"
        fill="#aac8e8" opacity="0.7">Category: Computers / Cloud Computing</text>
  <text x="160" y="2635"
        font-family="Georgia, serif" font-size="36"
        fill="#aac8e8" opacity="0.7">Subcategory: Amazon Web Services / Certification</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="2692" width="1800" height="8" fill="url(#accent)"/>
</svg>
