name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ── Markdown QA (no build tools required) ──────────────────────────────

      - name: Wide tables check
        run: |
          python3 - << 'EOF'
          import sys, glob, re
          base = "chapters/en-us"
          wide = []
          for fpath in sorted(glob.glob(f"{base}/*.md")):
              ch = fpath.split("/")[-1][:-3]
              for n, line in enumerate(open(fpath), 1):
                  if line.strip().startswith("|") and not re.match(r"^\s*\|[-:\s|]+\|\s*$", line):
                      cols = len([c for c in line.split("|") if c.strip()])
                      if cols >= 5:
                          wide.append(f"  {ch}:{n} ({cols} cols)")
          if wide:
              print("Wide tables detected (Kindle risk):"); [print(w) for w in wide]; sys.exit(1)
          print("  ✓ No wide tables")
          EOF

      - name: Chapter structure check
        run: |
          python3 - << 'EOF'
          import sys, glob
          base = "chapters/en-us"
          skip = {"00-introduction","33-when-it-depends","34-what-architect-means",
                  "appendix-a","appendix-b","appendix-c","appendix-d",
                  "zz-about-the-author"}
          issues = []
          for fpath in sorted(glob.glob(f"{base}/*.md")):
              ch = fpath.split("/")[-1][:-3]
              if any(ch.startswith(s) for s in skip): continue
              content = open(fpath).read()
              miss = [s for s in ["## Summary","## Exam Tips","## Exercises"] if s not in content]
              if miss: issues.append(f"  {ch}: missing {', '.join(miss)}")
          if issues:
              print("Incomplete chapters:"); [print(i) for i in issues]; sys.exit(1)
          print("  ✓ All chapters complete")
          EOF

      # ── Install build tools ────────────────────────────────────────────────

      - name: Install pandoc
        run: |
          PANDOC_VER=3.6.4
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VER}/pandoc-${PANDOC_VER}-1-amd64.deb" \
            -o /tmp/pandoc.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Set up Java (EPUBCheck)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install rsvg-convert and EPUBCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin unzip
          EC_VER=5.1.0
          curl -fsSL "https://github.com/w3c/epubcheck/releases/download/v${EC_VER}/epubcheck-${EC_VER}.zip" \
            -o /tmp/epubcheck.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/
          printf '#!/bin/sh\nexec java -jar /tmp/epubcheck-%s/epubcheck.jar "$@"\n' "${EC_VER}" \
            | sudo tee /usr/local/bin/epubcheck > /dev/null
          sudo chmod +x /usr/local/bin/epubcheck

      # ── Build EPUB ─────────────────────────────────────────────────────────

      - name: Generate cover PNG from SVG
        run: |
          mkdir -p build/kdp
          rsvg-convert --format=png --width=1800 --height=2700 \
            --output=build/kdp/cover.png assets/cover/cover.svg
          echo "  cover.png: $(du -sh build/kdp/cover.png | cut -f1)"

      - name: Assemble manuscript
        run: |
          mkdir -p build/epub
          cat assets/front-matter.md > build/manuscript.md
          for f in $(find chapters/en-us -maxdepth 1 -name "*.md" | sort); do
            printf '\n' >> build/manuscript.md
            cat "$f" >> build/manuscript.md
            printf '\n' >> build/manuscript.md
          done
          echo "  Lines: $(wc -l < build/manuscript.md)  Words: $(wc -w < build/manuscript.md)"

      - name: Build EPUB
        run: |
          # Uses committed build/kdp/cover.png — rsvg-convert not needed in CI
          pandoc build/manuscript.md \
            --from markdown+smart --to epub3 \
            --output build/epub/lets-build-on-aws-together.epub \
            --metadata-file assets/metadata.yaml \
            --css assets/styles/kindle.css \
            --epub-cover-image build/kdp/cover.png \
            --toc --toc-depth=2 --split-level=1 \
            --highlight-style=tango --standalone
          echo "  EPUB: $(du -sh build/epub/lets-build-on-aws-together.epub | cut -f1)"

      - name: Patch EPUB nav.xhtml
        run: |
          python3 - build/epub/lets-build-on-aws-together.epub << 'EOF'
          import sys, zipfile, shutil, os, re as _re
          epub_path = sys.argv[1]
          tmp_dir   = epub_path + ".patch_tmp"
          if os.path.exists(tmp_dir): shutil.rmtree(tmp_dir)
          os.makedirs(tmp_dir)
          with zipfile.ZipFile(epub_path, 'r') as z: z.extractall(tmp_dir)
          nav_path = os.path.join(tmp_dir, "EPUB", "nav.xhtml")
          with open(nav_path, 'r', encoding='utf-8') as f: nav = f.read()
          nav = nav.replace(
              '>Let’s Build on AWS Together</a></li>',
              '>Copyright</a></li>', 1)
          bodymatter = ('\n    <li>\n      '
              '<a href="text/ch003.xhtml" epub:type="bodymatter">Start Reading</a>\n    </li>')
          nav = nav.replace(
              '\n    <li>\n      <a href="text/title_page.xhtml" epub:type="titlepage">',
              bodymatter + '\n    <li>\n      <a href="text/title_page.xhtml" epub:type="titlepage">', 1)
          with open(nav_path, 'w', encoding='utf-8') as f: f.write(nav)
          text_dir = os.path.join(tmp_dir, "EPUB", "text")
          for xhtml in os.listdir(text_dir):
              if not xhtml.endswith(".xhtml"): continue
              fpath = os.path.join(text_dir, xhtml)
              with open(fpath, encoding='utf-8') as f: content = f.read()
              new = _re.sub(r'<th(?=[\s>])[^>]*>',
                  lambda m: m.group(0).replace('<th', '<th scope="col"', 1)
                            if 'scope=' not in m.group(0) else m.group(0), content)
              if new != content:
                  with open(fpath, 'w', encoding='utf-8') as f: f.write(new)
          out_path = epub_path + ".new"
          with zipfile.ZipFile(out_path, 'w', zipfile.ZIP_DEFLATED) as zout:
              zout.write(os.path.join(tmp_dir, "mimetype"), "mimetype",
                         compress_type=zipfile.ZIP_STORED)
              for root, _dirs, files in os.walk(tmp_dir):
                  for fname in files:
                      full = os.path.join(root, fname)
                      arc  = os.path.relpath(full, tmp_dir)
                      if arc == "mimetype": continue
                      zout.write(full, arc)
          shutil.move(out_path, epub_path)
          shutil.rmtree(tmp_dir)
          print("  nav.xhtml patched")
          EOF

      - name: EPUBCheck — 0 errors / 0 warnings
        run: epubcheck build/epub/lets-build-on-aws-together.epub

      - name: Verify EPUB landmarks
        run: |
          python3 - build/epub/lets-build-on-aws-together.epub << 'EOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              nav = z.read("EPUB/nav.xhtml").decode()
          missing = [t for t in ["bodymatter","titlepage","cover","toc"]
                     if f'epub:type="{t}"' not in nav]
          if missing: print(f"Missing landmarks: {missing}"); sys.exit(1)
          print("  ✓ All landmarks present")
          EOF

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: epub-ci-${{ github.sha }}
          path: build/epub/lets-build-on-aws-together.epub
          retention-days: 7
