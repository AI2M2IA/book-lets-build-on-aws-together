name: Qwen

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened]

jobs:
  qwen:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@qwen')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@qwen')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@qwen')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '@qwen'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: QwenLM/qwen-code-action@v1
        with:
          dashscope_api_key: ${{ secrets.DASHSCOPE_API_KEY }}
