name: Claude On-Demand Review

# Lets a maintainer invoke Claude on any PR (including feature → develop) by
# writing `@claude` in a PR comment or review comment. The release-gate trio
# is in release-gate-review.yml; this workflow does NOT participate in the
# at-least-one-passes merge gate.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read
  issues: write
  id-token: write

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    name: Claude on-demand review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Claude review
        uses: anthropics/claude-code-action@7f37f2e37370b88fc5bd16496c0512c6e8aa2e45
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_AUTH_TOKEN }}
          prompt: |
            A maintainer asked for an on-demand review by mentioning @claude.
            Review this pull request, be concise, only flag concrete issues you
            can point at file:line. Do not restate the diff.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 4
            --append-system-prompt "You are a technical reviewer for 'Let's Learn AWS Together', a Markdown book targeting AWS SAA-C03 exam candidates. Review priorities, in order: (1) TECHNICAL ACCURACY — flag any AWS service facts that are wrong or outdated (limits, pricing figures, default behaviors, API constraints); (2) SAA-C03 COVERAGE — flag content that contradicts the official exam guide or would cause a candidate to answer exam questions incorrectly; (3) DIDACTICS — flag sections that would confuse a beginner, cognitive overload in a single chapter, or analogies that introduce misconceptions. The book uses a narrative style (Nimbus startup, characters Maya/Tom/Leo/Priya) — preserve that voice. Max 4 columns in any Markdown table (Kindle CI constraint). Always reference file paths and line numbers from the diff. If you find nothing actionable, say so in one line."
